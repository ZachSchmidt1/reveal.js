            ## [ros2-essentials](https://github.com/j3soon/ros2-essentials)
            Zachary Schmidt  
            10/30/2025
            ---
            * ros2-essentials is a project using ROS2 Humble and simulation software for controlling mobile robots and robotic arms.
            * This project allows users to seamlessly go from simulation to reality with their robots.
            * Hobbyists, researchers, and students can all use it for their projects or interests.
            ---
            * There are some [documentation](https://github.com/j3soon/ros2-essentials/issues/32) and licensing areas that are open that can help keep the repository more organized and easier to follow.
            ---
            * The [contributing](https://github.com/j3soon/ros2-essentials/blob/main/CONTRIBUTING.md) guide has guidelines that are somewhat beginner-friendly.
            * One interesting thing is the commit message guidelines. There is a format and what as much information as possible, all references, and everyone who helped in the commit to be mentioned.
            ---
            * I plan to add the dependencies from the commits into the [README](https://github.com/j3soon/ros2-essentials/blob/main/README.md) file.
            * I will need to look through all of the commits and see if I can find all of the references' licenses and add them to the README.
            * I hope to start as soon as possible, and I do not foresee the need of any additional support or resources.
