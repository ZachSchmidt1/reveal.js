						Zachary Schmidt

						--- 
						* ros2-essentials is a project using ROS2 Humble and simulation software for controlling mobile robots and robotic arms. 
						* This project allows users to seamlessly go from simulation to reality with their robots. 
						* Hobbyists, researchers, and students can all use it for their projects or interests. 
						--- 
						* There are some [documentation](https://github.com/j3soon/ros2-essentials/issues/32) and licnesing areas that are open that can help keep the repository more organized and easier to follow.

						* One interesting thing is the commit message guidelines. There is a format and what as much information as possible, all referneces, and everyone who helped in the commit to be mentionded.
