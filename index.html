<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>reveal.js</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/black.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section data-markdown>
					<textarea data-template> 
						##[ros2-essentials](https://github.com/j3soon/ros2-essentials) 
						Zachary Schmidt 
						10/30/2025 
						--- 
						* ros2-essentials is a project using ROS2 Humble and simulation software for controlling mobile robots and robotic arms. 
						* This project allows users to seamlessly go from simulation to reality with their robots. 
						* Hobbyists, researchers, and students can all use it for their projects or interests. 
						--- 
						* There are some [documentation](https://github.com/j3soon/ros2-essentials/issues/32) and licnesing areas that are open that can help keep the repository more organized and easier to follow. 
						--- 
						* The [contributing](https://github.com/j3soon/ros2-essentials/blob/main/CONTRIBUTING.md) guide has guidelines that are somewhat beginner-friendly. 
						* One interesting thing is the commit message guidelines. There is a format and what as much information as possible, all referneces, and everyone who helped in the commit to be mentionded. 
						--- 
						* I plan to add the depenencies from the commits into the [README](https://github.com/j3soon/ros2-essentials/blob/main/README.md) file. 
						* I will need to look through all of the commits and see if I can find all of the referneces' licenses and add them to the README. 
						* I hope to start as soon as possible, and I do not forsee the need of any additional support or resources. 
						
					</textarea>
				</section>
			</div>
		</div>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script>
			// More info about initialization & config:
			// - https://revealjs.com/initialization/
			// - https://revealjs.com/config/
			Reveal.initialize({
				hash: true,

				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes ]
			});
		</script>
	</body>
</html>
